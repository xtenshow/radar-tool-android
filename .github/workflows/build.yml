name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Prevent overlapping builds on the same ref.
concurrency:
  group: radar-tool-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cancel previous queued/running builds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          previous_runs="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow build.yml \
            --limit 100 \
            --json databaseId,status \
            --jq ".[] | select(.status == \"queued\" or .status == \"in_progress\") | select(.databaseId != $GITHUB_RUN_ID) | .databaseId")"
          if [ -n "$previous_runs" ]; then
            while IFS= read -r run_id; do
              [ -n "$run_id" ] || continue
              echo "Cancelling previous workflow run $run_id"
              gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY"
            done <<< "$previous_runs"
          else
            echo "No previous queued or running builds found."
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev \
            cmake libffi-dev libssl-dev \
            libltdl-dev

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip==24.3.1
          pip install buildozer==1.5.0 Cython==0.29.36

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate Python syntax
        run: python -m compileall -q main.py android_storage.py file_browser.py tests

      - name: Package source archive
        run: |
          zip -qr "$RUNNER_TEMP/RadarTool-Android-Source.zip" . \
            -x ".git/*" ".buildozer/*" "bin/*" "*/__pycache__/*" "*.pyc"

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: RadarTool-Android-Source
          path: ${{ runner.temp }}/RadarTool-Android-Source.zip
          if-no-files-found: error

      - name: Select Java 17 for Gradle and Buildozer
        shell: bash
        run: |
          set -euo pipefail
          test -x "$JAVA_HOME_17_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_17_X64/bin/java" -version

      - name: Pin python-for-android host pip
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\\n' 'pip==25.3' > "$RUNNER_TEMP/pip-constraints.txt"
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/pip-constraints.txt" >> "$GITHUB_ENV"
          test "$(cat "$RUNNER_TEMP/pip-constraints.txt")" = "pip==25.3"
          python -m pip install --dry-run --upgrade pip

      - name: Build APK with Buildozer
        run: |
          buildozer android debug

      - name: Boot x86_64 Android emulator and smoke-test APK
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n1)"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager | sort | tail -n1)"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          ADB="$SDK_ROOT/platform-tools/adb"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          test -x "$EMULATOR"
          test -x "$ADB"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "emulator" "platform-tools" \
            "system-images;android-33;google_apis;x86_64"
          echo "no" | "$AVDMANAGER" create avd --force \
            --name radar-x86-smoke \
            --package "system-images;android-33;google_apis;x86_64" \
            --device "pixel_2"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$SDK_ROOT/platform-tools:$SDK_ROOT/emulator:$PATH"
          "$EMULATOR" -avd radar-x86-smoke -no-window -no-audio \
            -no-boot-anim -gpu swiftshader_indirect -no-snapshot \
            -no-metrics > "$RUNNER_TEMP/radar-emulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/radar-emulator.pid"
          for attempt in $(seq 1 100); do
            booted="$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r' || true)"
            if [ "$booted" = "1" ]; then break; fi
            sleep 3
          done
          test "$booted" = "1" || {
            cat "$RUNNER_TEMP/radar-emulator.log"
            echo "Android emulator did not finish booting."
            exit 1
          }
          APK="$(find bin -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$APK"
          echo "Installing $APK"
          "$ADB" install -r "$APK"
          "$ADB" shell am force-stop org.tenshorecords.radartool || true
          "$ADB" shell am start -W -n \
            org.tenshorecords.radartool/org.kivy.android.PythonActivity
          sleep 25
          "$ADB" shell pidof org.tenshorecords.radartool
          "$ADB" logcat -d -t 4000 > "$RUNNER_TEMP/radar-logcat.txt"
          if grep -E "FATAL EXCEPTION|Fatal signal [0-9]+|could not load.*\.so|UnsatisfiedLinkError" \
              "$RUNNER_TEMP/radar-logcat.txt"; then
            exit 1
          fi
          echo "APK installed and remained running on x86_64 emulator."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RadarTool-APK
          path: bin/*.apk
          if-no-files-found: error
