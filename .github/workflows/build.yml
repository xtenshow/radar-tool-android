name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Prevent overlapping builds on the same ref.
concurrency:
  group: radar-tool-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cancel previous queued/running builds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch_name="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          previous_runs="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow build.yml \
            --branch "$branch_name" \
            --limit 100 \
            --json databaseId,status \
            --jq ".[] | select(.status == \"queued\" or .status == \"in_progress\") | select(.databaseId != $GITHUB_RUN_ID) | .databaseId")"
          if [ -n "$previous_runs" ]; then
            while IFS= read -r run_id; do
              [ -n "$run_id" ] || continue
              echo "Cancelling previous workflow run $run_id"
              gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY"
            done <<< "$previous_runs"
          else
            echo "No previous queued or running builds found."
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev \
            cmake libffi-dev libssl-dev \
            libltdl-dev

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip==24.3.1
          pip install buildozer==1.5.0 Cython==0.29.36

      - name: Validate Python syntax
        run: python -m compileall -q main.py android_storage.py operation_history.py file_transactions.py tests

      - name: Run safety and persistence tests
        run: python -m unittest discover -s tests -v

      - name: Package source archive
        run: |
          zip -qr "$RUNNER_TEMP/RadarTool-Android-Source.zip" . \
            -x ".git/*" ".buildozer/*" "bin/*" "*/__pycache__/*" "*.pyc"

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: RadarTool-Android-Source
          path: ${{ runner.temp }}/RadarTool-Android-Source.zip
          if-no-files-found: error

      - name: Configure stable Android signing (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" && -n "${ANDROID_KEYSTORE_PASSWORD:-}" && -n "${ANDROID_KEY_ALIAS:-}" && -n "${ANDROID_KEY_PASSWORD:-}" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/radartool-release.keystore"
            test -s "$RUNNER_TEMP/radartool-release.keystore"
            {
              echo "P4A_RELEASE_KEYSTORE=$RUNNER_TEMP/radartool-release.keystore"
              echo "P4A_RELEASE_KEYSTORE_PASSWD=$ANDROID_KEYSTORE_PASSWORD"
              echo "P4A_RELEASE_KEYALIAS=$ANDROID_KEY_ALIAS"
              echo "P4A_RELEASE_KEYALIAS_PASSWD=$ANDROID_KEY_PASSWORD"
              echo "RADAR_RELEASE_SIGNING=true"
            } >> "$GITHUB_ENV"
            echo "Stable release signing is configured."
          else
            echo "Release signing secrets are incomplete; building a debug APK."
            echo "RADAR_RELEASE_SIGNING=false" >> "$GITHUB_ENV"
          fi

      - name: Build APK with Buildozer
        run: |
          if [[ "${RADAR_RELEASE_SIGNING:-false}" == "true" ]]; then
            buildozer android release
          else
            buildozer android debug
          fi

      - name: Verify APK package and emulator ABIs
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          python - "$apk" <<'PY'
          import sys
          import zipfile

          apk_path = sys.argv[1]
          with zipfile.ZipFile(apk_path) as archive:
              names = archive.namelist()
          required = ("arm64-v8a", "armeabi-v7a", "x86_64", "x86")
          for abi in required:
              prefix = "lib/" + abi + "/"
              if not any(name.startswith(prefix) for name in names):
                  raise SystemExit("APK is missing native libraries for " + abi)
          print("APK contains ARM64, ARM32, x86_64 and x86 native libraries:", apk_path)
          PY
          aapt="$(find "$ANDROIDSDK/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$aapt"
          "$aapt" dump badging "$apk" | grep -F "package: name='org.tenshorecords.radartool' versionCode='2' versionName='1.1.0'"
          apksigner="$(find "$ANDROIDSDK/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"


      - name: Install and launch APK on x86_64 Android Emulator
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="\${ANDROID_SDK_ROOT:-$HOME/.buildozer/android/platform/android-sdk}"
          sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          avdmanager="$(find "$sdk_root/cmdline-tools" -type f -name avdmanager | sort -V | tail -n 1)"
          test -n "$sdkmanager"
          test -n "$avdmanager"
          yes | "$sdkmanager" --sdk_root="$sdk_root" --licenses >/dev/null || true
          "$sdkmanager" --sdk_root="$sdk_root" "emulator" "platform-tools" "system-images;android-33;google_apis;x86_64"
          echo "no" | "$avdmanager" create avd \
            --force --name radar-x86_64 \
            --package "system-images;android-33;google_apis;x86_64" \
            --device "pixel_2"
          "$sdk_root/emulator/emulator" \
            -avd radar-x86_64 -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -accel off \
            >"$RUNNER_TEMP/radar-emulator.log" 2>&1 &
          adb="$sdk_root/platform-tools/adb"
          "$adb" wait-for-device
          booted=false
          for attempt in $(seq 1 60); do
            if [[ "$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              booted=true
              break
            fi
            sleep 5
          done
          if [[ "$booted" != "true" ]]; then
            cat "$RUNNER_TEMP/radar-emulator.log"
            exit 1
          fi
          apk="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          "$adb" install "$apk"
          "$adb" shell monkey -p org.tenshorecords.radartool 1
          sleep 15
          if ! "$adb" shell pidof org.tenshorecords.radartool >/dev/null 2>&1; then
            "$adb" logcat -d -t 250 | grep -E "AndroidRuntime|python|SDL|FATAL" || true
            cat "$RUNNER_TEMP/radar-emulator.log"
            exit 1
          fi
          echo "APK installed and launched successfully on Android 13 x86_64."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RadarTool-APK
          path: bin/*.apk
          if-no-files-found: error
