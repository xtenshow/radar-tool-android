name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev \
            cmake libffi-dev libssl-dev \
            libltdl-dev

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip==24.3.1
          pip install buildozer==1.5.0 Cython==0.29.36

      - name: Validate Python syntax
        run: python -m compileall -q main.py android_storage.py

      - name: Package source archive
        run: |
          zip -qr "$RUNNER_TEMP/RadarTool-Android-Source.zip" . \
            -x ".git/*" ".buildozer/*" "bin/*" "*/__pycache__/*" "*.pyc"

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: RadarTool-Android-Source
          path: ${{ runner.temp }}/RadarTool-Android-Source.zip
          if-no-files-found: error

      - name: Build APK with Buildozer
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RadarTool-APK
          path: bin/*.apk
          if-no-files-found: error
