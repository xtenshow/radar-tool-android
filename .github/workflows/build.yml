name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Prevent overlapping builds on the same ref.
concurrency:
  group: radar-tool-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cancel previous queued/running builds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          previous_runs="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow build.yml \
            --limit 100 \
            --json databaseId,status \
            --jq ".[] | select(.status == \"queued\" or .status == \"in_progress\") | select(.databaseId != $GITHUB_RUN_ID) | .databaseId")"
          if [ -n "$previous_runs" ]; then
            while IFS= read -r run_id; do
              [ -n "$run_id" ] || continue
              echo "Cancelling previous workflow run $run_id"
              gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY"
            done <<< "$previous_runs"
          else
            echo "No previous queued or running builds found."
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev \
            cmake libffi-dev libssl-dev \
            libltdl-dev

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip==24.3.1
          pip install buildozer==1.5.0 Cython==0.29.36

      - name: Validate Python syntax
        run: python -m compileall -q main.py android_storage.py

      - name: Package source archive
        run: |
          zip -qr "$RUNNER_TEMP/RadarTool-Android-Source.zip" . \
            -x ".git/*" ".buildozer/*" "bin/*" "*/__pycache__/*" "*.pyc"

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: RadarTool-Android-Source
          path: ${{ runner.temp }}/RadarTool-Android-Source.zip
          if-no-files-found: error

      - name: Build APK with Buildozer
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RadarTool-APK
          path: bin/*.apk
          if-no-files-found: error
